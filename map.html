<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MADAR 3D Viewer</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background-color: #121212;
            overflow: hidden;
            font-family: Tahoma, sans-serif;
        }
        /* المجسم يملأ الشاشة بالكامل في الخلفية بحجمه الطبيعي */
        .content-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        .sketchfab-embed-wrapper, .content-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        /* الشريط العلوي (يغطي أول 1 سم من المجسم ويمنع النقر فوقه) */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 2cm;
            background-color: #6e6e6e;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.6);
        }
        /* الشريط السفلي (يغطي آخر 1 سم من المجسم ويمنع النقر تحته) */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100vw;
            height: 1.5cm;
            background-color: #6e6e6e;
            z-index: 10000;
        }
    </style>
</head>
<body>

    <!-- المجسم يملأ الشاشة بالكامل في الخلفية -->
    <div class="content-container">
        <div class="sketchfab-embed-wrapper"> 
            <iframe title="MADAR 3D" frameborder="0" allowfullscreen mozallowfullscreen="true" webkitallowfullscreen="true" allow="autoplay; fullscreen; xr-spatial-tracking" xr-spatial-tracking execution-while-out-of-viewport execution-while-not-rendered web-share width="100%" height="100%" src="https://sketchfab.com/models/60bc028c6263403bb4e6faa3858ddb63/embed?autostart=1&ui_hint=0&ui_theme=dark&dnt=1"></iframe> 
        </div>
    </div>

    <!-- الشريط العلوي الذي يغطي الأطراف ويحمل النص -->
    <div class="top-bar">New Madar 3D Construction</div>
    
    <!-- الشريط السفلي الذي يغطي الأطراف -->
    <div class="bottom-bar"></div>

<!-- كود الحماية والمنع (يضاف قبل نهاية </body>) -->
<style>
    /* منع تحديد النص وحظر حفظ الصور عبر CSS */
    body {
        -webkit-user-select: none; /* Safari */
        -moz-user-select: none;    /* Firefox */
        -ms-user-select: none;     /* IE 10+/Edge */
        user-select: none;         /* Standard */
    }
    
    img {
        -webkit-user-drag: none;
        -khtml-user-drag: none;
        -moz-user-drag: none;
        -o-user-drag: none;
        user-drag: none;
        pointer-events: none; /* منع النقر أو حفظ الصور */
    }

    /* استثناء لضمان عمل النقر على البطاقات والعناصر التفاعلية والنوافذ المنبثقة */
    .glass-card, .clickable-container, button, a, input, select, iframe {
        pointer-events: auto;
    }
</style>

<script>
    // 
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
    });

    // --- 1. (Copy, Save, View Source, Print, DevTools) ---
    document.addEventListener('keydown', function (e) {
        // منع Ctrl+C, Ctrl+U, Ctrl+S, Ctrl+P, Ctrl+A
        if (e.ctrlKey && ['c', 'u', 's', 'p', 'a'].includes(e.key.toLowerCase())) {
            e.preventDefault();
            return false;
        }
        // منع F12 أوtrl+Shift+I / J / C
        if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && ['i', 'j', 'c'].includes(e.key.toLowerCase()))) {
            e.preventDefault();
            return false;
        }
    });

    // --- 2.  ---
    document.addEventListener('dragstart', function(e) {
        e.preventDefault();
    });
    document.addEventListener('selectstart', function(e) {
        e.preventDefault();
    });
</script>

    
</body>
</html>
